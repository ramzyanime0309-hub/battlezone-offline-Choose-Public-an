name: Death Race Godot validation

on:
  push:
    branches:
      - death-race
    paths:
      - "DeathRaceGodot/**"
      - ".github/workflows/death-race-godot-validation.yml"
  pull_request:
    branches:
      - death-race
    paths:
      - "DeathRaceGodot/**"
      - ".github/workflows/death-race-godot-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-validation:
    name: Import and smoke-test Godot 4 project
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download official Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" \
            --output "$RUNNER_TEMP/godot/godot.zip"
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          mv "$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"

      - name: Report Godot version
        run: godot --version

      - name: Import project and parse scripts
        run: godot --headless --editor --path DeathRaceGodot --quit

      - name: Run project smoke test
        run: godot --headless --path DeathRaceGodot --script res://tests/smoke_test.gd
